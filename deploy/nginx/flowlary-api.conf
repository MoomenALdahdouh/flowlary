# Flowlary API reverse proxy — nginx 1.25.x
# Mount into nginx container at /etc/nginx/conf.d/default.conf
#
# Upstream: Flowlary Node gateway on port 8787 (Docker service name: api)
# Public TLS termination is expected at the host/CDN layer in production.

upstream flowlary_api {
  server api:8787 max_fails=3 fail_timeout=10s;
  keepalive 16;
}

server {
  listen 80;
  server_name _;

  access_log /var/log/nginx/flowlary-api.access.log;
  error_log /var/log/nginx/flowlary-api.error.log warn;

  client_max_body_size 128k;
  large_client_header_buffers 4 16k;

  location /health {
    proxy_pass http://flowlary_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
  }

  location /ready {
    proxy_pass http://flowlary_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
  }

  location / {
    proxy_pass http://flowlary_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 90s;

    proxy_buffering on;
    proxy_buffer_size 16k;
    proxy_buffers 4 32k;

    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 10s;
  }
}
