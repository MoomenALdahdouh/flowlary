<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Everyday writing surfaces</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 760px; margin: 1.5rem auto; }
      label { display: block; margin: 1rem 0 0.25rem; font-weight: 600; }
      input, textarea { width: 100%; box-sizing: border-box; padding: 0.55rem; font-size: 16px; }
      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    </style>
  </head>
  <body>
    <h1>Everyday writing surfaces</h1>
    <p>Independent lab for real-user typing, not the project demo sentences.</p>

    <label for="chat">Chat reply</label>
    <textarea id="chat" rows="3" placeholder="Reply in the thread"></textarea>

    <label for="email">Email compose</label>
    <textarea id="email" rows="4" placeholder="Write the email"></textarea>

    <label for="comment">Product comment</label>
    <textarea id="comment" rows="3" dir="auto"></textarea>

    <div class="row">
      <div>
        <label for="subject">Subject line</label>
        <input id="subject" type="text" />
      </div>
      <div>
        <label for="search">Search box</label>
        <input id="search" type="text" />
      </div>
    </div>

    <label for="notes">Meeting notes</label>
    <textarea id="notes" rows="5" dir="auto"></textarea>

    <label for="composer">Rich composer</label>
    <div id="composer" contenteditable="true" role="textbox" style="min-height:4rem;border:1px solid #ccc;padding:0.55rem;font-size:16px;"></div>
  </body>
</html>
