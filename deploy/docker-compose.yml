# Flowlary production stack — self-healing API behind nginx.
# Usage (from repo root):
#   cp backend/.env.example backend/.env   # fill production values
#   docker compose -f deploy/docker-compose.yml up -d --build
#   curl -fsS http://127.0.0.1:8080/health
#   curl -fsS http://127.0.0.1:8080/ready

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file:
      - ../backend/.env
    environment:
      FLOWLARY_ENV: production
      HOST: 0.0.0.0
      PORT: 8787
    volumes:
      - flowlary-data:/data
    expose:
      - "8787"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:1.25.4-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./nginx/flowlary-api.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  flowlary-data:
