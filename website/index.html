<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f8fafc" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('flowlary-theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
          document.documentElement.setAttribute('data-theme', theme)
          document.documentElement.classList.toggle('dark', theme === 'dark')
          document.documentElement.style.colorScheme = theme
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', theme === 'light' ? '#f7f8fc' : '#0b1120')
          var favicon = document.querySelector('link[rel="icon"]')
          if (favicon) {
            favicon.setAttribute(
              'href',
              theme === 'light' ? '/favicon-light.svg' : '/favicon-dark.svg',
            )
          }
          var locale = localStorage.getItem('flowlary-locale')
          if (locale === 'ar' || locale === 'fa') {
            document.documentElement.lang = locale
            document.documentElement.dir = 'rtl'
          } else if (locale) {
            document.documentElement.lang = locale
            document.documentElement.dir = 'ltr'
          }
        } catch (e) {}
      })()
    </script>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
          href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet"
        />
        <link rel="icon" href="/favicon-dark.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon-dark.svg" />
    <!--app-head-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
