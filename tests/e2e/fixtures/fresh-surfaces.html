<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Inbox · ticket · notes</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 820px; margin: 1.25rem auto; background: #f4f4f5; }
      .card { background: #fff; border: 1px solid #e4e4e7; border-radius: 10px; padding: 1rem 1.1rem; margin-bottom: 1rem; }
      label { display: block; margin: 0.7rem 0 0.25rem; font-weight: 600; font-size: 13px; }
      input, textarea { width: 100%; box-sizing: border-box; padding: 0.55rem 0.65rem; font-size: 16px; border: 1px solid #d4d4d8; border-radius: 8px; }
      #thread { min-height: 4.5rem; border: 1px solid #d4d4d8; border-radius: 8px; padding: 0.55rem; background: #fff; font-size: 16px; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Support ticket</h1>
      <label for="reply">Reply</label>
      <textarea id="reply" rows="3" placeholder="Write a reply"></textarea>
      <label for="title">Ticket title</label>
      <input id="title" type="text" />
    </div>
    <div class="card">
      <h2>Email draft</h2>
      <label for="draft">Body</label>
      <textarea id="draft" rows="4" dir="auto"></textarea>
    </div>
    <div class="card">
      <h2>Standup notes</h2>
      <label for="standup">Notes</label>
      <textarea id="standup" rows="4" dir="auto"></textarea>
    </div>
    <div class="card">
      <h2>Thread composer</h2>
      <div id="thread" contenteditable="true" role="textbox" aria-label="Thread composer"></div>
    </div>
  </body>
</html>
